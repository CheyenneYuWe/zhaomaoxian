<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>对昭矛线的了解度测试</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>

  /* ============================================================

     This page uses kvdb.io — a free, no-login key-value store —

     Pages (no server needed). One-time setup before you deploy:

     1. Run this once, anywhere with curl (terminal / Replit / etc):
          curl -d "email=you@example.com" https://kvdb.io
        It returns a bucket ID, e.g. "Fd55uogXyxYdnXJvnyN8Xo".
     2. Paste that ID into KVDB_BUCKET_ID in the <script> below,
        replacing "PASTE_YOUR_BUCKET_ID_HERE".
     3. Push this file to a GitHub repo, enable GitHub Pages, done.

     Note: this bucket has no password — anyone who has this page's
     source can read/write it. Fine for a casual leaderboard among
     friends, not for anything sensitive.
     ============================================================ */

  :root{
    --bg:#f6f4ee;
    --panel:#ffffff;
    --ink:#191714;
    --ink-soft:#5b564d;
    --line:#191714;
    --accent:#e8462f;
    --accent-soft:#fbe4de;
    --good:#1c7a4a;
    --good-soft:#e2f2e6;
    --bad:#b5311f;
    --bad-soft:#fbe4de;
    --blue:#2856d8;
    --blue-soft:#e3eaf9;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:40px 16px 72px;
  }
  .stage{width:100%; max-width:560px;}

  .brand{margin-bottom:20px;}
  .brand .kicker{
    font-size:12px;
    font-weight:700;
    letter-spacing:.04em;
    color:var(--accent);
    margin-bottom:6px;
  }
  .brand h1{
    font-size:30px;
    font-weight:900;
    line-height:1.3;
    margin:0;
    letter-spacing:.01em;
  }

  .card{
    background:var(--panel);
    border:2px solid var(--ink);
    padding:28px 24px;
  }

  .lead-text{
    font-size:15px;
    line-height:1.75;
    margin:0 0 22px;
    color:var(--ink-soft);
  }
  .name-row{display:flex; gap:8px;}
  .name-row input{
    flex:1;
    min-width:0;
    background:var(--bg);
    border:2px solid var(--ink);
    padding:13px 14px;
    color:var(--ink);
    font-size:15px;
    font-family:inherit;
  }
  .name-row input:focus{outline:none; border-color:var(--accent);}
  .btn{
    border:2px solid var(--ink);
    padding:13px 16px;
    font-family:inherit;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    background:var(--panel);
    color:var(--ink);
    white-space:nowrap;
  }
  .btn:hover{background:var(--bg);}
  @media (hover:hover) and (pointer:fine){
    .btn:hover{background:var(--bg);}
    .btn-primary:hover{background:var(--blue); border-color:var(--blue);}
    .option:hover{background:var(--bg);}
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{
    background:var(--ink);
    color:var(--panel);
    border-color:var(--ink);
  }
  .btn-block{width:100%;}
  .hint{font-size:12.5px; color:var(--ink-soft); margin-top:10px;}
  .confirm-row{margin-top:14px;}

  .warning-box p{
    font-size:14.5px;
    line-height:1.9;
    margin:0 0 10px;
    color:var(--ink-soft);
  }
  .warning-box p.angry{color:var(--accent); font-weight:700;}
  .final-choice{margin-top:20px; display:flex; flex-direction:column; gap:8px;}

  .progress-wrap{margin-bottom:20px;}
  .progress-top{
    display:flex; justify-content:space-between;
    font-size:12px; font-weight:700; color:var(--ink-soft);
    margin-bottom:8px;
  }
  .progress-bar{height:4px; background:var(--accent-soft);}
  .progress-fill{height:100%; background:var(--ink); transition:width .25s ease;}

  .q-multi-tag{
    display:inline-block;
    font-size:11px; font-weight:700;
    background:var(--accent-soft);
    color:var(--accent);
    padding:3px 8px;
    margin-bottom:10px;
  }
  .q-text{font-size:18px; font-weight:900; line-height:1.6; margin:2px 0 18px;}
  .options{display:flex; flex-direction:column; gap:8px;}
  .option{
    text-align:left;
    background:var(--panel);
    border:2px solid var(--ink);
    padding:12px 14px;
    color:var(--ink);
    font-size:14.5px;
    cursor:pointer;
    display:flex; gap:10px; align-items:flex-start;
    font-family:inherit;
  }
  .option .tag{
    flex:none; width:22px; height:22px;
    border:2px solid var(--ink);
    display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:900;
  }
  .option.selected{border-color:var(--blue); background:var(--blue-soft);}
  .option.selected .tag{background:var(--blue); color:#fff; border-color:var(--blue);}
  .option.correct{border-color:var(--good); background:var(--good-soft);}
  .option.correct .tag{background:var(--good); color:#fff; border-color:var(--good);}
  .option.wrong{border-color:var(--bad); background:var(--bad-soft);}
  .option.wrong .tag{background:var(--bad); color:#fff; border-color:var(--bad);}
  .option[disabled]{cursor:default;}

  .nav-row{display:flex; justify-content:flex-end; margin-top:20px;}

  .result-score{margin-bottom:2px;}
  .result-score .num{font-size:56px; font-weight:900; line-height:1;}
  .result-score .out-of{font-size:13px; color:var(--ink-soft); font-weight:700;}
  .tier-title{font-size:21px; font-weight:900; margin:10px 0 8px; color:var(--accent);}
  .tier-desc{font-size:14.5px; line-height:1.85; color:var(--ink-soft); margin:0 0 22px; white-space:pre-line;}
  .tier-desc.empty{display:none;}

  .result-actions{display:flex; gap:8px; margin-bottom:4px;}
  .divider{border:none; border-top:2px dashed var(--ink); margin:26px 0 18px;}

  .board-title{font-size:14px; font-weight:900; margin-bottom:4px;}
  .board-sub{font-size:12px; color:var(--ink-soft); margin-bottom:12px;}
  .board-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px;}
  .board-row{
    display:flex; align-items:center; gap:10px;
    border:2px solid var(--ink);
    padding:8px 12px; font-size:13.5px;
  }
  .board-row .rank{flex:none; width:20px; font-weight:900;}
  .board-row .name{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .board-row .score{flex:none; font-weight:900; color:var(--accent);}
  .board-row.me{background:var(--accent-soft); border-color:var(--accent);}
  .board-empty, .board-loading{font-size:13px; color:var(--ink-soft); padding:8px 0;}

  .footer-note{font-size:11.5px; color:var(--ink-soft); margin-top:22px;}

  .screen{display:none;}
  .screen.active{display:block;}

  @media (max-width:420px){
    .brand h1{font-size:24px;}
    .card{padding:20px 16px;}
    .result-score .num{font-size:44px;}
  }
</style>
</head>
<body>

<div class="stage">
  <div class="brand">
    <h1>对昭矛线的了解度测试</h1>
  </div>

  <div class="card">

    <!-- Screen 1: nickname -->
    <div class="screen active" id="screen-nickname">
      <div class="name-row">
        <input type="text" id="nicknameInput" placeholder="你是哪个..." maxlength="20">
        <button class="btn" id="btnSkipToWarning">就不告诉你</button>
      </div>
      <p class="hint" id="nameError" style="display:none; color:var(--accent); font-weight:700;">告诉我嘛，告诉我嘛，方便我去小窗讨伐你</p>
      <div class="confirm-row">
        <button class="btn btn-primary btn-block" id="btnStartWithName">带着昵称，开始测试</button>
      </div>
    </div>

    <!-- Screen 2: warning after clicking 就不告诉你 -->
    <div class="screen" id="screen-warning">
      <div class="warning-box">
        <p>如果你是出于好奇点开这个链接，那你就狠心跳过吧。</p>
        <p class="angry">如果你是被我胁迫填这个测试的，你敢不留昵称，我就在心里扎你小人。</p>
      </div>
      <div class="final-choice" id="finalChoice" style="display:none;">
        <button class="btn btn-block" id="btnReallySkip">我的名字是世界瞒着你最大的事情</button>
        <button class="btn btn-primary btn-block" id="btnGoBackToName">我的名字是 dalala___</button>
      </div>
    </div>

    <!-- Screen 3: quiz -->
    <div class="screen" id="screen-quiz">
      <div class="progress-wrap">
        <div class="progress-top">
          <span id="progressLabel">第 1 / 40 题</span>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:2.5%;"></div></div>
      </div>
      <div id="multiTag" class="q-multi-tag" style="display:none;">这题选哪个都对，随便选</div>
      <div class="q-text" id="qText"></div>
      <div class="options" id="qOptions"></div>
      <div class="nav-row">
        <button class="btn btn-primary" id="btnNext" disabled>下一题</button>
      </div>
    </div>

    <!-- Screen 4: result -->
    <div class="screen" id="screen-result">
      <div class="result-score">
        <span class="num" id="scoreNum">0</span>
        <span class="out-of"> / 40 分</span>
      </div>
      <div class="tier-title" id="tierTitle"></div>
      <div class="tier-desc" id="tierDesc"></div>
      <div class="result-actions">
        <button class="btn" style="flex:1;" id="btnRetry">让我再蒙一次吧</button>
        <button class="btn btn-primary" style="flex:1;" id="btnSubmitBoard">上榜留名</button>
      </div>

      <hr class="divider">
      <div class="board-title">对某道题有疑虑？解释都在这里哦</div>
      <div class="board-sub">输入题号（1-40），看看昭矛线怎么说</div>
      <div class="name-row" style="margin-bottom:10px;">
        <input type="number" id="explainInput" min="1" max="40" placeholder="题号，比如 6">
        <button class="btn" id="btnExplain">查看解释</button>
      </div>
      <div id="explainResult" style="display:none; border:2px solid var(--ink); padding:12px 14px; margin-bottom:22px;">
        <div id="explainQ" style="font-weight:900; font-size:14px; margin-bottom:6px;"></div>
        <div id="explainText" style="font-size:14px; line-height:1.8; color:var(--ink-soft); white-space:pre-line;"></div>
      </div>

      <hr class="divider">
      <div class="board-title">交心排行榜</div>
      <div class="board-sub">昵称与分数会公开显示，慎重填写</div>
      <ul class="board-list" id="boardList">
        <li class="board-loading">排行榜加载中...</li>
      </ul>
      <div class="footer-note" id="configNote" style="display:none;">
        排行榜还没配置好——打开这个文件，把 KVDB_BUCKET_ID 换成你自己的 bucket ID 就能用了（说明写在文件最上面）。
      </div>
    </div>

  </div>
</div>

    "加起来有一万多次（当然我把我朋友发的哈也算上了不然数不过来）",

  ];

  function getTier(score){
    for(var i=0;i<TIERS.length;i++){
      if(score>=TIERS[i].min && score<=TIERS[i].max) return TIERS[i];
    }
    return TIERS[0];
  }

  // ---------- state ----------
  var state = { nickname:"", current:0, answered:[], correctCount:0 };

  function show(id){
    document.querySelectorAll(".screen").forEach(function(el){ el.classList.remove("active"); });
    document.getElementById(id).classList.add("active");
  }

  // ---------- nickname flow ----------
  var nicknameInput = document.getElementById("nicknameInput");

  var nameErrorEl = document.getElementById("nameError");

  document.getElementById("btnStartWithName").addEventListener("click", function(){
    var val = nicknameInput.value.trim();
    if(!val){
      nameErrorEl.style.display = "block";
      nicknameInput.focus();
      return;
    }
    nameErrorEl.style.display = "none";
    state.nickname = val;
    startQuiz();
  });

  nicknameInput.addEventListener("input", function(){
    if(nicknameInput.value.trim()) nameErrorEl.style.display = "none";
  });

  document.getElementById("btnSkipToWarning").addEventListener("click", function(){
    show("screen-warning");
    document.getElementById("finalChoice").style.display = "none";
    setTimeout(function(){
      document.getElementById("finalChoice").style.display = "flex";
    }, 1600);
  });

  document.getElementById("btnReallySkip").addEventListener("click", function(){
    state.nickname = "世界瞒着你最大的事情";
    startQuiz();
  });

  document.getElementById("btnGoBackToName").addEventListener("click", function(){
    show("screen-nickname");
    nicknameInput.focus();
  });

  // ---------- quiz flow ----------
  var qTextEl = document.getElementById("qText");
  var qOptionsEl = document.getElementById("qOptions");
  var btnNext = document.getElementById("btnNext");
  var progressLabel = document.getElementById("progressLabel");
  var progressFill = document.getElementById("progressFill");
  var multiTag = document.getElementById("multiTag");

  function startQuiz(){
    state.current = 0;
    state.answered = new Array(QUESTIONS.length).fill(null);
    state.correctCount = 0;
    show("screen-quiz");
    renderQuestion();
  }

  function renderQuestion(){
    var idx = state.current;
    var item = QUESTIONS[idx];
    progressLabel.textContent = "第 " + (idx+1) + " / " + QUESTIONS.length + " 题";
    progressFill.style.width = (((idx+1)/QUESTIONS.length)*100) + "%";
    multiTag.style.display = item.multi ? "inline-block" : "none";
    qTextEl.textContent = item.q;
    qOptionsEl.innerHTML = "";
    btnNext.disabled = true;
    btnNext.textContent = (idx === QUESTIONS.length-1) ? "查看结果" : "下一题";

    var letters = ["A","B","C","D"];
    item.o.forEach(function(optText, optIdx){
      var btn = document.createElement("button");
      btn.className = "option";
      btn.innerHTML = '<span class="tag">'+letters[optIdx]+'</span><span>'+optText+'</span>';
      btn.addEventListener("click", function(){ chooseOption(optIdx); });
      qOptionsEl.appendChild(btn);
    });
  }

  function chooseOption(optIdx){
    state.answered[state.current] = optIdx;

    var optionEls = qOptionsEl.querySelectorAll(".option");
    optionEls.forEach(function(el, i){
      el.classList.toggle("selected", i === optIdx);
    });

    btnNext.disabled = false;
  }

  btnNext.addEventListener("click", function(){
    if(state.current < QUESTIONS.length - 1){
      state.current++;
      renderQuestion();
    } else {
      finishQuiz();
    }
  });

  // ---------- result ----------
  var scoreNumEl = document.getElementById("scoreNum");
  var tierTitleEl = document.getElementById("tierTitle");
  var tierDescEl = document.getElementById("tierDesc");
  var boardSubmitted = false;

  function computeScore(){
    var score = 0;
    for(var i=0;i<QUESTIONS.length;i++){
      var ans = state.answered[i];
      if(ans === null) continue;
      var item = QUESTIONS[i];
      if(item.multi || ans === item.c) score++;
    }
    return score;
  }

  function finishQuiz(){
    var score = computeScore();
    state.correctCount = score;
    var tier = getTier(score);
    scoreNumEl.textContent = score;
    tierTitleEl.textContent = tier.title;
    if(tier.desc){
      tierDescEl.textContent = tier.desc;
      tierDescEl.classList.remove("empty");
    } else {
      tierDescEl.textContent = "";
      tierDescEl.classList.add("empty");
    }
    boardSubmitted = false;
    var submitBtn = document.getElementById("btnSubmitBoard");
    submitBtn.disabled = false;
    submitBtn.textContent = "上榜留名";
    document.getElementById("configNote").style.display = boardConfigured ? "none" : "block";
    document.getElementById("explainResult").style.display = "none";
    document.getElementById("explainInput").value = "";
    show("screen-result");
    loadBoard();
  }

  document.getElementById("btnRetry").addEventListener("click", function(){
    nicknameInput.value = "";
    nameErrorEl.style.display = "none";
    show("screen-nickname");
    nicknameInput.focus();
  });

  // ---------- explanation lookup ----------
  var explainInput = document.getElementById("explainInput");
  var explainResult = document.getElementById("explainResult");
  var explainQ = document.getElementById("explainQ");
  var explainText = document.getElementById("explainText");

  document.getElementById("btnExplain").addEventListener("click", function(){
    var n = parseInt(explainInput.value, 10);
    if(!n || n < 1 || n > QUESTIONS.length){
      explainResult.style.display = "block";
      explainQ.textContent = "";
      explainText.textContent = "填个 1 到 " + QUESTIONS.length + " 之间的题号叭";
      return;
    }
    explainQ.textContent = "第 " + n + " 题：" + QUESTIONS[n-1].q;
    explainText.textContent = EXPLANATIONS[n-1];
    explainResult.style.display = "block";
  });

  // ---------- leaderboard (kvdb.io, works on any static host) ----------
  var boardListEl = document.getElementById("boardList");

  async function loadBoard(){
    if(!boardConfigured){
      boardListEl.innerHTML = '<li class="board-empty">排行榜还没配置好，见下方提示</li>';
      return;
    }
    boardListEl.innerHTML = '<li class="board-loading">排行榜加载中...</li>';
    try{
      var listResp = await fetch(KVDB_BASE + "/?prefix=" + KEY_PREFIX);
      if(!listResp.ok) throw new Error("list failed");
      var listText = await listResp.text();
      var keys = listText.split("\n").map(function(k){ return k.trim(); }).filter(Boolean);
      if(keys.length === 0){
        boardListEl.innerHTML = '<li class="board-empty">还没有人上榜，你可以成为第一个</li>';
        return;
      }
      keys = keys.slice(-100); // cap how many we fetch
      var entries = [];
      await Promise.all(keys.map(async function(key){
        try{
          var r = await fetch(KVDB_BASE + "/" + key);
          if(!r.ok) return;
          var txt = await r.text();
          var parsed = JSON.parse(txt);
          entries.push(parsed);
        }catch(e){ /* skip bad entry */ }
      }));
      entries.sort(function(a,b){ return b.score - a.score || b.ts - a.ts; });
      entries = entries.slice(0, 20);
      if(entries.length === 0){
        boardListEl.innerHTML = '<li class="board-empty">还没有人上榜，你可以成为第一个</li>';
        return;
      }
      boardListEl.innerHTML = "";
      entries.forEach(function(e, i){
        var li = document.createElement("li");
        li.className = "board-row" + (e.nickname === state.nickname && e.score === state.correctCount ? " me" : "");
        li.innerHTML = '<span class="rank">'+(i+1)+'</span><span class="name">'+escapeHtml(e.nickname)+'</span><span class="score">'+e.score+' 分</span>';
        boardListEl.appendChild(li);
      });
    }catch(err){
      boardListEl.innerHTML = '<li class="board-empty">排行榜暂时加载不出来，晚点再试试</li>';
    }
  }

  function escapeHtml(str){
    var div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  document.getElementById("btnSubmitBoard").addEventListener("click", async function(){
    if(boardSubmitted) return;
    var btn = this;
    if(!boardConfigured){
      document.getElementById("configNote").style.display = "block";
      return;
    }
    btn.disabled = true;
    btn.textContent = "上榜中...";
    try{
      var key = KEY_PREFIX + Date.now() + "-" + Math.floor(Math.random()*100000);
      var value = JSON.stringify({ nickname: state.nickname, score: state.correctCount, ts: Date.now() });
      var res = await fetch(KVDB_BASE + "/" + key, { method:"POST", body:value });
      if(res.ok){
        boardSubmitted = true;
        btn.textContent = "已上榜";
        loadBoard();
      } else {
        btn.disabled = false;
        btn.textContent = "上榜失败，再试一次";
      }
    }catch(err){
      btn.disabled = false;
      btn.textContent = "上榜失败，再试一次";
    }
  });

})();
</script>
</body>
</html>
